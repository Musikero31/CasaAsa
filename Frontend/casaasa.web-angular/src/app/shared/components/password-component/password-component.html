<div class="mb-3">
    <label class="form-label">Password</label>
    <input
        type="password"
        class="form-control"
        formControlName="password"
        placeholder="Password">
</div>

<div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input
        type="password"
        class="form-control"
        formControlName="confirmPassword"
        placeholder="Confirm Password">
</div>
