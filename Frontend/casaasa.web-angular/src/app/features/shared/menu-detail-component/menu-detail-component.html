<div class="container-fluid py-4">
    <div class="card-body">
        <!-- Menu Item 1 -->
        <div class="border rounded p-3 mb-3">
            <!-- <div class="d-flex justify-content-between
                        align-items-center mb-3">
                <h6 class="mb-0">Menu Item #1</h6>

                <button
                    type="button"
                    class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash me-1"></i>
                    Remove
                </button>
            </div> -->

            <div class="row g-3">
                <!-- Item Name -->
                <div class="col-md-6">
                    <label for="itemName1" class="form-label">
                        Item Name
                    </label>
                    <input type="text" class="form-control" id="itemName1" name="itemName1" placeholder="e.g. Chicken Adobo"
                        required>
                </div>

                <!-- Category -->
                <div class="col-md-3">
                    <label for="category1" class="form-label">
                        Category
                    </label>
                    <!-- Iterate from the table -->
                    <!-- <select class="form-select" id="category1" name="category1" required>
                        <option value="">Select category</option>
                        <option value="main">Main Dish</option>
                        <option value="side">Side Dish</option>
                        <option value="dessert">Dessert</option>
                        <option value="beverage">Beverage</option>
                    </select> -->
                </div>

                <!-- Price -->
                <div class="col-md-3">
                    <label for="price1" class="form-label">
                        Price ($)
                    </label>
                    <input type="number" class="form-control" id="price1" name="price1" min="0.01" step="0.01"
                        placeholder="0.00" required>
                </div>

                <!-- Description -->
                <div class="col-12">
                    <label for="description1" class="form-label">
                        Description
                    </label>
                    <textarea class="form-control" id="description1" name="description1" rows="2"
                        placeholder="Describe the menu item...">
                </textarea>
                </div>

                <!-- Availability -->
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="available1" name="available1" checked>
                        <label class="form-check-label" for="available1">
                            Available for ordering
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex flex-wrap justify-content-end gap-2 mb-4">

        <button type="button" class="btn btn-outline-secondary">
            Cancel
        </button>

        <button type="button" class="btn btn-primary px-4">
            <i class="bi bi-save me-1"></i>
            Save Menu
        </button>

    </div>
</div>
